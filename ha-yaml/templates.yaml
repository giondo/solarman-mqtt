# templates.yaml

- sensor:
    # State Mapping for Inverter
    - name: "SolarmanPV Inverter Device State"
      state: >-
        {% set mapper = {'1': 'Online', '2': 'Failure', '3': 'Offline'} %}
        {% set val = states('sensor.solarmanpv_inverter') %}
        {{ mapper.get(val, 'Unknown') }}

    # State Mapping for Logger
    - name: "SolarmanPV Logger Device State"
      state: >-
        {% set mapper = {'1': 'Online', '2': 'Failure', '3': 'Offline'} %}
        {% set val = states('sensor.solarmanpv_logger') %}
        {{ mapper.get(val, 'Unknown') }}

    # Individual Inverter Metrics from Attributes
    - name: "SolarmanPV Inverter DC Voltage PV1"
      unit_of_measurement: "V"
      device_class: voltage
      state: "{{ state_attr('sensor.solarmanpv_inverter', 'DC_Voltage_PV1') }}"
      state_class: measurement

    - name: "SolarmanPV Inverter DC Current PV1"
      unit_of_measurement: "A"
      device_class: current
      state: "{{ state_attr('sensor.solarmanpv_inverter', 'DC_Current_PV1') }}"
      state_class: measurement

    - name: "SolarmanPV Inverter Total Production 1"
      unit_of_measurement: "kWh"
      device_class: energy
      state: "{{ state_attr('sensor.solarmanpv_inverter', 'Total_Production_1') }}"
      state_class: total_increasing

    - name: "SolarmanPV Inverter AC Radiator Temp"
      unit_of_measurement: "°C"
      device_class: temperature
      state: "{{ state_attr('sensor.solarmanpv_inverter', 'AC_Radiator_Temp') }}"
      state_class: measurement