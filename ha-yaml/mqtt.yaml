# mqtt.yaml

sensor:
  # Station Topics - Real-time Power
  - name: "SolarmanPV Station Generation Power"
    state_topic: "solarmanpv/station/generationPower"
    unit_of_measurement: "W"
    state_class: measurement
    device_class: power

  - name: "SolarmanPV Station Generation Total"
    state_topic: "solarmanpv/station/generationTotal"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing

  # Inverter Base Sensor (Carries the attributes)
  - name: "SolarmanPV Inverter"
    state_topic: "solarmanpv/inverter/deviceState"
    json_attributes_topic: "solarmanpv/inverter/attributes"

  # Logger Base Sensor (Carries the attributes)
  - name: "SolarmanPV Logger"
    state_topic: "solarmanpv/logger/deviceState"
    json_attributes_topic: "solarmanpv/logger/attributes"